[project]
name = "sml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.16"
dependencies = [
    "datasets>=5.1.0,<6.0.0",
    "lm-eval[api]>=0.4.13,<1.0.0",
    "mlx>=0.32.4,<1.0.0",
    "numpy>=2.5.4,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "sentencepiece>=0.2.2,<1.0.0",
    "torch>=2.15.0,<3.0.0",
    "zstandard>=0.25.0,<1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18.0",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sml"
module-root = "v2/src"
